<div class="modal-scrim">
    <section class="bingo-modal" role="dialog" aria-modal="true" aria-labelledby="bingo-title">
        <div class="modal-spark" aria-hidden="true">✳</div>
        <p class="eyebrow">Connection complete</p>
        <h2 id="bingo-title">BINGO<span>!</span></h2>
        <p>You found your line.<br>That is worth a little celebration.</p>
        <button hx-post="/dismiss-modal" hx-target="#game-container" hx-swap="outerHTML" class="arcade-cta modal-cta"><span>Keep Playing</span><b aria-hidden="true">↗</b></button>
    </section>
</div>
