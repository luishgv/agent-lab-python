<div class="bingo-grid">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}hx-post="/toggle/{{ square.id }}" hx-target="#game-container" hx-swap="outerHTML"{% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="bingo-square{% if square.is_marked %} is-marked{% endif %}{% if is_winning %} is-winning{% endif %}{% if square.is_free_space %} is-free{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="square-index">{{ '%02d'|format(square.id + 1) }}</span>
        <span class="square-text">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}<span class="square-check" aria-hidden="true">✓</span>{% endif %}
    </button>
    {% endfor %}
</div>
